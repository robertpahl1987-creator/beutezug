<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1733">
<meta name="color-scheme" content="only dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}html,body{margin:0}body{font-size:14px}img{max-width:100%}</style>
<title>Beutezug</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-screen arcade cabinet — purse bar on top, swapping stage in the middle, tab rail at the bottom */
  --ink:#1b1733; --ink2:#262049; --ink3:#352b63; --line:#4a3f80;
  --brass:#f2b632; --brass-d:#a86d10; --coral:#ff6b57; --coral-d:#b8392a;
  --mint:#43d3b1; --mint-d:#1d8a70; --cream:#fff3da; --cream-d:#e8d3a9;
  --text:#fbf6ff; --muted:#b9b0d8; --dark:#2a2140; --wood:#8a5a33;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  --sh:clamp(52px,9.2vh,84px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-weight:800;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 60% at 50% 0%,#3a2f74 0%,transparent 70%),var(--ink)}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-weight:400;letter-spacing:.01em}

/* top purse */
#top{display:flex;gap:6px;align-items:center;padding-block:8px 6px}
.pill{display:flex;align-items:center;gap:4px;background:var(--ink2);border:2px solid var(--line);border-radius:999px;padding:2px 10px 2px 2px;min-width:0;font-family:var(--display);font-size:15px}
.pill svg{width:24px;height:24px;flex:none}
.pill.coins{flex:1}.pill.gems{flex:none}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;align-items:center;gap:2px;font-family:var(--display);font-size:14px}
.mini svg{width:24px;height:24px}
#bell{position:relative;width:36px;height:36px;border-radius:10px;background:var(--coral);border:2px solid var(--coral-d);display:grid;place-items:center;flex:none}
#bell svg{width:20px;height:20px}
.badge{position:absolute;top:-6px;right:-6px;background:#fff;color:var(--coral-d);font-family:var(--display);font-size:12px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

#stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative}
.pane{min-height:100%;display:flex;flex-direction:column;gap:10px;padding-block:4px 12px}

/* slot */
.board{background:linear-gradient(var(--cream),var(--cream-d));color:var(--dark);border-radius:14px;border:3px solid var(--wood);padding:6px 12px;display:flex;align-items:center;gap:10px}
.board .who{flex:1;min-width:0}
.board .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--wood)}
.board .nm{font-family:var(--display);font-size:20px;line-height:1.05}
.board .amt{font-family:var(--display);font-size:20px;color:var(--brass-d)}
.board svg{width:44px;height:44px;flex:none}
.evbar{background:var(--ink3);border:2px solid var(--line);border-radius:12px;padding:6px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.evbar .t{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.track{height:16px;background:#130f26;border-radius:8px;overflow:hidden;position:relative}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--mint-d),var(--mint));border-radius:8px;transition:width .5s}
.track b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:12px;font-weight:400;text-shadow:0 1px 2px #0008}
.evbar .rw{display:flex;align-items:center;gap:2px;font-family:var(--display);font-size:13px}
.evbar .rw svg{width:24px;height:24px}

.machine{background:linear-gradient(#e2533f,#a8301f);border-radius:20px;border:4px solid #6e1d12;padding:10px;box-shadow:0 6px 0 #4a120a,inset 0 2px 0 #ff9a85;position:relative}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#5a160d;border-radius:12px;padding:6px}
.reel{height:calc(var(--sh)*3);overflow:hidden;background:linear-gradient(#d9c7a3,#fff8e8 25%,#fff8e8 75%,#d9c7a3);border-radius:8px;position:relative}
.reel::after{content:"";position:absolute;left:0;right:0;top:calc(var(--sh));height:var(--sh);border-block:2px dashed #c9a86a55;pointer-events:none}
.strip{will-change:transform}
.cell{height:var(--sh);display:grid;place-items:center}
.cell svg{height:78%;width:auto}
.reel.win .cell:nth-child(2) svg{animation:pop .5s ease 2}
@keyframes pop{50%{transform:scale(1.18)}}
.mrow{display:flex;gap:8px;align-items:stretch;margin-top:10px}
#betBtn{background:var(--brass);color:var(--dark);border-radius:12px;border:3px solid var(--brass-d);font-family:var(--display);font-size:20px;padding:4px 14px;box-shadow:0 3px 0 var(--brass-d)}
#betBtn small{display:block;font-family:var(--body);font-size:10px;font-weight:900;letter-spacing:.06em}
.spinbox{flex:1;background:#2a0b06;border-radius:12px;padding:4px 8px;display:flex;flex-direction:column;justify-content:center}
.spinbar{height:22px;border-radius:11px;background:#130f26;position:relative;overflow:hidden}
.spinbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#7fe9ff,#28b3d8);border-radius:11px;transition:width .3s}
.spinbar b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:16px;text-shadow:0 1px 2px #0009}
.spinbox small{font-size:11px;color:#ffc9be;text-align:center;margin-top:2px}
#spinBtn{margin-top:4px;width:100%;background:linear-gradient(var(--coral),#e0412d);border:4px solid var(--coral-d);border-radius:22px;box-shadow:0 7px 0 #7a2015;padding:10px 10px 6px;font-family:var(--display);font-size:clamp(30px,9vw,42px);color:#fff;text-shadow:0 3px 0 #9a2a1b;transition:transform .08s}
#spinBtn:active{transform:translateY(5px);box-shadow:0 2px 0 #7a2015}
#spinBtn small{display:block;font-family:var(--body);font-size:12px;font-weight:900;text-shadow:none;color:#ffd9d2;letter-spacing:.04em}
#spinBtn.auto{background:linear-gradient(var(--mint),var(--mint-d));border-color:#0f5a48;box-shadow:0 7px 0 #0f5a48;text-shadow:0 3px 0 #0f5a48}
.sidekit{display:flex;gap:8px}
.chip{flex:1;display:flex;align-items:center;gap:6px;background:var(--ink2);border:2px solid var(--line);border-radius:12px;padding:5px 8px;font-size:12px;text-align:left;min-width:0}
.chip svg{width:30px;height:30px;flex:none}
.chip b{display:block;font-family:var(--display);font-weight:400;font-size:14px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--coral);margin-left:auto;flex:none}

/* village */
.vhead{display:flex;align-items:center;gap:10px}
.vhead h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;flex:1;text-wrap:balance}
.vprog{font-family:var(--display);font-size:15px;color:var(--brass)}
.vscene{background:linear-gradient(#5b9bd8,#9fd2ef 55%,#7cbf62 56%,#5c9c47);border-radius:16px;border:3px solid var(--line);height:170px;position:relative;overflow:hidden}
.vscene svg{position:absolute;bottom:8px;width:21%;height:auto}
.blist{display:flex;flex-direction:column;gap:8px}
.brow{background:var(--cream);color:var(--dark);border-radius:14px;display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--cream-d)}
.brow svg{width:56px;height:56px}
.brow .nm{font-family:var(--display);font-size:18px;line-height:1}
.stars{color:#d2b98a;letter-spacing:1px;font-size:14px}
.stars i{font-style:normal;color:var(--brass-d)}
.btn{background:linear-gradient(#5ee0bd,#2aa886);border:3px solid #13705a;border-radius:12px;color:#fff;font-family:var(--display);font-size:16px;padding:6px 12px;box-shadow:0 3px 0 #13705a;text-shadow:0 1px 0 #13705a;line-height:1.1}
.btn small{display:block;font-family:var(--body);font-size:11px;text-shadow:none}
.btn:disabled{filter:grayscale(1);opacity:.55;cursor:default}
.btn.gold{background:linear-gradient(#ffd668,var(--brass));border-color:var(--brass-d);color:var(--dark);text-shadow:none;box-shadow:0 3px 0 var(--brass-d)}
.btn.red{background:linear-gradient(#ff8a78,var(--coral));border-color:var(--coral-d);box-shadow:0 3px 0 var(--coral-d);text-shadow:0 1px 0 var(--coral-d)}
.btn.wide{width:100%;padding:10px}
.dmg{color:var(--coral-d);font-size:12px}

/* cards */
.sec{font-family:var(--display);font-weight:400;font-size:20px;margin:4px 0 0}
.chests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chest{background:var(--ink2);border:2px solid var(--line);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.chest svg{width:52px;height:52px}
.chest .n{font-family:var(--display);font-size:15px}
.chest .d{font-size:11px;color:var(--muted)}
.set{background:var(--ink2);border:2px solid var(--line);border-radius:14px;padding:8px}
.set header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-family:var(--display);font-size:17px}
.set header span{font-family:var(--body);font-size:12px;color:var(--muted)}
.set.done{border-color:var(--brass)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.card{position:relative;border-radius:10px;aspect-ratio:3/3.4;max-width:100%;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;color:#fff;font-size:11px;line-height:1.1;border:2px solid #0003;overflow:hidden}
.card .ic{font-family:var(--display);font-size:24px;width:40px;height:40px;border-radius:50%;background:#fff3;display:grid;place-items:center}
.card .st{color:#ffe28a;font-size:10px;letter-spacing:1px}
.card.miss{background:#1f1a3a!important;color:#6f6699;border:2px dashed #4a3f80}
.card.miss .ic{background:#2c2552}
.card .cnt{position:absolute;top:3px;right:3px;background:var(--coral);border-radius:8px;font-size:10px;padding:0 5px;font-family:var(--display)}
.card.r5{box-shadow:inset 0 0 0 2px var(--brass)}

/* wheel */
.wtabs{display:flex;gap:6px}
.wtabs button{flex:1;padding:8px;border-radius:12px;background:var(--ink2);border:2px solid var(--line);font-family:var(--display);font-size:15px}
.wtabs button[aria-pressed="true"]{background:var(--brass);color:var(--dark);border-color:var(--brass-d)}
.wwrap{position:relative;width:min(84vw,330px);aspect-ratio:1;max-width:100%;margin:6px auto 0}
.wwrap > svg.wh{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.75,.16,1)}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:34px;height:40px;z-index:2}
.wcenter{position:absolute;inset:38%;border-radius:50%;background:radial-gradient(#ffe7a3,var(--brass) 60%,var(--brass-d));border:4px solid #fff6;display:grid;place-items:center;font-family:var(--display);color:var(--dark);font-size:14px;text-align:center;line-height:1}
.winfo{text-align:center;color:var(--muted);font-size:13px}

/* team */
.thead{display:flex;gap:10px;align-items:center;background:var(--cream);color:var(--dark);border-radius:14px;padding:8px 10px;border:3px solid var(--wood)}
.flag{width:34px;height:44px;border-radius:4px 4px 16px 16px;background:linear-gradient(90deg,#222 33%,#d22 33% 66%,#f5c400 66%);flex:none;border:2px solid #0004}
.thead .nm{font-family:var(--display);font-size:20px;line-height:1}
.thead .sub{font-size:12px;color:var(--wood)}
.castle{background:linear-gradient(#2f6f5c,#1f4e40);border:3px solid #13705a;border-radius:14px;padding:8px 10px;display:flex;gap:10px;align-items:center}
.castle svg{width:54px;height:54px;flex:none}
.castle .t{font-family:var(--display);font-size:18px;color:var(--brass)}
.castle small{display:block;font-size:11px;color:#cfeee4}
.feed{display:flex;flex-direction:column;gap:8px}
.msg{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:start}
.av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:18px;color:#fff;border:2px solid #fff3}
.bub{background:var(--cream);color:var(--dark);border-radius:4px 14px 14px 14px;padding:6px 10px;min-width:0}
.bub .who{display:flex;justify-content:space-between;font-family:var(--display);font-size:16px}
.bub .who span{font-family:var(--body);font-size:11px;color:var(--wood)}
.bub p{margin:2px 0 4px;font-size:13px;color:#7a3a2a}
.reqrow{display:flex;align-items:center;gap:8px}
.reqrow .spinbar{flex:1;height:18px}
.reqrow .spinbar b{font-size:13px}
.me .bub{background:#d9f5ec}
.tbar{display:flex;gap:8px;position:sticky;bottom:0;padding-top:6px;background:linear-gradient(transparent,var(--ink) 30%)}
.tbar .btn{flex:1}

/* nav */
#nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px 4px;border-top:2px solid var(--line)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:12px;font-size:11px;color:var(--muted);position:relative}
#nav button svg{width:30px;height:30px}
#nav button[aria-current="page"]{background:var(--ink3);color:var(--text)}
#nav .badge{top:0;right:12%}

/* overlays */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translate(-50%,-20px);opacity:0;background:var(--dark);border:2px solid var(--brass);color:var(--text);padding:8px 14px;border-radius:12px;font-size:14px;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fly{position:fixed;z-index:40;font-family:var(--display);font-size:30px;color:var(--brass);text-shadow:0 3px 0 #6b3f00,0 0 12px #000;pointer-events:none;animation:fly 1.3s ease-out forwards;white-space:nowrap}
@keyframes fly{0%{transform:translate(-50%,10px) scale(.6);opacity:0}20%{transform:translate(-50%,0) scale(1.15);opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
#modal{position:fixed;inset:0;background:#0b0818cc;z-index:30;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.panel{width:min(100%,440px);max-height:100%;overflow-y:auto;background:var(--cream);color:var(--dark);border-radius:20px;border:4px solid var(--wood);padding:14px;display:flex;flex-direction:column;gap:10px;animation:rise .25s ease}
@keyframes rise{from{transform:translateY(20px) scale(.96);opacity:0}}
.panel h3{margin:0;font-family:var(--display);font-weight:400;font-size:26px;text-align:center;text-wrap:balance}
.panel p{margin:0;text-align:center;font-size:14px}
.panel .big{font-family:var(--display);font-size:34px;color:var(--brass-d);text-align:center}
.tgts{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tgts button{flex:none;padding:6px 10px;border-radius:10px;background:#fff;border:2px solid var(--cream-d);font-size:13px}
.tgts button[aria-pressed="true"]{background:var(--coral);color:#fff;border-color:var(--coral-d)}
.tgts .rv{font-size:10px;display:block;color:var(--coral-d)}
.tgts button[aria-pressed="true"] .rv{color:#fff}
.evil{background:linear-gradient(#8fc4ea,#b8e0f3 55%,#86c46a 56%);border-radius:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:30px 4px 6px;position:relative}
.evil button{display:flex;flex-direction:column;align-items:center;border-radius:10px;padding:2px}
.evil button:disabled{opacity:.4}
.evil button svg{width:100%;height:auto}
.evil .hit{animation:shake .4s 2}
@keyframes shake{25%{transform:translateX(-4px) rotate(-3deg)}75%{transform:translateX(4px) rotate(3deg)}}
.hammerfly{position:absolute;width:44px;height:44px;top:0;left:50%;transition:transform .45s ease-in;z-index:2}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:linear-gradient(#9c6b3d,#7a4f2a);border-radius:14px;padding:10px}
.hole{aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(#5a3a1d 40%,#7a512b 70%);border:3px solid #4a2e14;display:grid;place-items:center;font-family:var(--display);color:#fff;font-size:13px;text-align:center;line-height:1.1}
.hole svg{width:60%;height:60%}
.hole.open{background:radial-gradient(#3a2410 40%,#5a3a1d)}
.ptitle{display:flex;justify-content:center;gap:4px;align-items:center}
.ptitle svg{width:30px;height:30px}
.list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto}
.li{background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:center}
.li p{flex:1;text-align:left;margin:0}
.li time{font-size:11px;color:var(--wood);display:block}
.cardsrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.row{display:flex;gap:8px}.row>*{flex:1}

/* ===== Grafik-Update ===== */
#app{background:radial-gradient(120% 50% at 50% 0%,#40338a 0%,transparent 70%),radial-gradient(circle at 20% 80%,#2a2257 0 2px,transparent 3px) 0 0/34px 34px,radial-gradient(circle at 70% 30%,#2a2257 0 1.5px,transparent 2.5px) 0 0/48px 48px,var(--ink)}
.pill{background:linear-gradient(#2e2759,#211b44);box-shadow:inset 0 2px 0 #ffffff14;padding:2px 12px 2px 2px}
.pill.coins span{color:#ffe08a}.pill.gems span{color:#ffb3df}
.board{padding:6px 10px;box-shadow:0 4px 0 #5c3a1c}
.board .nm{font-size:18px}.board .amt{font-size:18px}
.machine{padding:16px 10px 10px;background:linear-gradient(#ef6450,#b43521 60%,#962b1a);border-radius:22px}
.bulbs{position:absolute;left:14px;right:14px;top:4px;height:8px;background:radial-gradient(circle,#fff3b0 2.5px,#f6c445 3.5px,transparent 4.5px) 0 50%/16px 8px repeat-x;animation:chase 1.2s steps(2) infinite;opacity:.95}
@keyframes chase{to{background-position:16px 50%}}
.infoBtn{position:absolute;top:-10px;right:-6px;width:30px;height:30px;border-radius:50%;background:var(--brass);color:var(--dark);font-family:var(--display);font-size:18px;border:3px solid var(--brass-d);box-shadow:0 2px 0 var(--brass-d);z-index:2}
.reels{position:relative;padding:8px;gap:6px;background:linear-gradient(#4a120a,#6e1d12);box-shadow:inset 0 3px 8px #0008}
.reels::before,.reels::after{content:"";position:absolute;top:50%;width:0;height:0;border-block:9px solid transparent;transform:translateY(-50%);z-index:2}
.reels::before{left:-4px;border-left:12px solid var(--brass)}
.reels::after{right:-4px;border-right:12px solid var(--brass)}
.reel{background:linear-gradient(#cdb88f 0%,#fffaf0 22%,#ffffff 50%,#fffaf0 78%,#cdb88f 100%);box-shadow:inset 0 0 0 2px #0002}
.reel::after{border:0;background:linear-gradient(90deg,transparent,#f6c44522,transparent)}
.reel.win{box-shadow:inset 0 0 0 3px var(--brass),0 0 14px #f6c44599}
.cell svg{height:80%;filter:drop-shadow(0 2px 0 #0002)}
.payline{margin-top:8px;min-height:38px;background:#2a0b06;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 10px;font-family:var(--display);font-size:17px;color:#ffe08a;text-align:center;box-shadow:inset 0 2px 4px #0008}
.payline svg{width:28px;height:28px;flex:none}
.payline.hot{color:#fff;background:linear-gradient(90deg,#a86d10,#f6c445,#a86d10);text-shadow:0 2px 0 #6b3f00;animation:pop .45s ease 2}
.payline.dim{color:#c99a90}
#spinBtn{border-radius:24px;background:linear-gradient(#ff8a6e,var(--coral) 40%,#d8382a)}
.chip{background:linear-gradient(#2e2759,#211b44)}
.vscene{height:200px;border:3px solid #2a2257;background:
  radial-gradient(circle at 82% 22%,#fff6c4 0 16px,#ffe08a55 17px 30px,transparent 31px),
  radial-gradient(60px 20px at 22% 26%,#fff 60%,transparent 62%),
  radial-gradient(44px 14px at 30% 20%,#fff 60%,transparent 62%),
  radial-gradient(70% 40% at 20% 80%,#6fb556 60%,transparent 61%),
  radial-gradient(80% 45% at 85% 82%,#5fa548 60%,transparent 61%),
  linear-gradient(#6aaee6,#b6e0f6 58%,#7cc362 58%,#4f8f3c)}
.vscene svg{width:23%}
.brow{grid-template-columns:62px 1fr auto;box-shadow:0 3px 0 var(--cream-d)}
.brow svg{width:62px;height:62px}
.evil{background:linear-gradient(#7fbbe8,#bfe4f6 55%,#7cc362 55%,#5a9a45)}
#nav button[aria-current="page"]{background:linear-gradient(#40338a,#2e2759);box-shadow:inset 0 -3px 0 var(--brass)}
.set{background:linear-gradient(#2e2759,#211b44)}
.card{box-shadow:0 2px 0 #0004}

.inp{width:100%;font:inherit;font-weight:700;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#130f26;color:var(--text)}
.inp:focus{outline:3px solid var(--mint);outline-offset:1px}
.panel .inp,.panel textarea{background:#fff;color:var(--dark);border-color:var(--cream-d);width:100%;font:inherit;font-weight:700;padding:8px;border-radius:10px;border:2px solid var(--cream-d)}
textarea.inp{resize:none}
.form{display:flex;flex-direction:column;gap:12px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.panel .fl{color:var(--wood)}
.flags{display:flex;gap:8px;flex-wrap:wrap}
.flags .flag{width:34px;height:44px;cursor:pointer}
.flags .flag[aria-pressed="true"]{outline:3px solid var(--brass);outline-offset:2px}
.preview{display:flex;gap:10px;align-items:center;background:var(--cream);color:var(--dark);border-radius:14px;padding:8px 10px;border:3px dashed var(--wood)}
.preview .nm{font-family:var(--display);font-size:20px;line-height:1}.preview .sub{font-size:12px;color:var(--wood)}
.tcard{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--cream);color:var(--dark);border-radius:14px;padding:8px 10px;box-shadow:0 3px 0 var(--cream-d)}
.tc-main{min-width:0}.tcard .nm{font-family:var(--display);font-size:17px;line-height:1.1}
.tcard .sub{font-size:12px;color:#7a3a2a}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--wood);margin-top:2px}
.err{color:#ffb3a8;font-size:13px;margin:0}
.sysmsg{text-align:center;font-size:12px;color:var(--muted);background:var(--ink2);border-radius:10px;padding:4px 8px}
.li .av{width:32px;height:32px;font-size:14px;flex:none}

#acct{position:relative;width:36px;height:36px;border-radius:10px;background:var(--brass);border:2px solid var(--brass-d);display:grid;place-items:center;flex:none}
#acct svg{width:20px;height:20px}
.dotOn{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--mint);border:2px solid var(--ink)}
.err2{color:var(--coral-d);font-size:13px;text-align:center}
.chatrow{display:flex;gap:6px;width:100%}
.chatrow .inp{flex:1;min-width:0;padding:8px 10px}
.tbar{flex-wrap:wrap}
.oauth{display:flex;align-items:center;justify-content:center;gap:10px;text-shadow:none}
.oauth.g{background:#fff;color:#1f1f1f;border-color:#c9c9c9;box-shadow:0 3px 0 #c9c9c9}
.oauth.f{background:#1877f2;color:#fff;border-color:#0d5bc4;box-shadow:0 3px 0 #0d5bc4}
.ologo{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:Arial,sans-serif;font-weight:900;font-size:16px}
.oauth.g .ologo{color:#4285f4;border:2px solid #4285f4}
.oauth.f .ologo{background:#fff;color:#1877f2}
.or{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--wood)}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--cream-d)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

</head>
<body>
<div id="app">
  <header id="top">
    <div class="pill coins"><svg viewBox="0 0 100 100" id="icCoin"></svg><span class="num" id="tCoins">0</span></div>
    <div class="pill gems"><svg viewBox="0 0 100 100" id="icGem"></svg><span class="num" id="tGems">0</span></div>
    <div class="mini"><svg viewBox="0 0 100 100" id="icStar"></svg><span class="num" id="tStars">0</span></div>
    <div class="mini"><svg viewBox="0 0 100 100" id="icShield"></svg><span class="num" id="tShields">0/3</span></div>
    <button id="acct" aria-label="Konto"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#1b1733"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7Z" fill="#1b1733"/></svg><span class="dotOn" id="acctDot" hidden></span></button>
    <button id="bell" aria-label="Nachrichten"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.8V3a1.5 1.5 0 0 0-3 0v1.2A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg><span class="badge" id="bellBadge" hidden>0</span></button>
  </header>

  <main id="stage">
    <section class="pane" id="p-slot">
      <div class="board">
        <svg viewBox="0 0 100 100" id="richIcon"></svg>
        <div class="who"><div class="lbl">Reichster Nachbar · Überfallziel</div><div class="nm" id="richName">–</div></div>
        <div class="amt num" id="richAmt">0</div>
      </div>
      <div class="evbar">
        <div class="t">Beutejagd<br><span id="evRound" style="color:var(--text)">Runde 1</span></div>
        <div class="track"><i id="evFill"></i><b class="num" id="evTxt">0/0</b></div>
        <div class="rw" id="evRw"></div>
      </div>
      <div class="machine">
        <div class="bulbs"></div>
        <button class="infoBtn" id="payBtn" aria-label="Gewinntabelle">?</button>
        <div class="reels">
          <div class="reel" id="r0"><div class="strip"></div></div>
          <div class="reel" id="r1"><div class="strip"></div></div>
          <div class="reel" id="r2"><div class="strip"></div></div>
        </div>
        <div class="payline" id="winBar">Drück auf DREHEN und hol dir Beute</div>
        <div class="mrow">
          <button id="betBtn" aria-label="Einsatz ändern"><span id="betTxt">x1</span><small>EINSATZ</small></button>
          <div class="spinbox">
            <div class="spinbar"><i id="spFill"></i><b class="num" id="spTxt">50/50</b></div>
            <small id="spTimer">voll</small>
          </div>
        </div>
      </div>
      <button id="spinBtn">DREHEN<small id="spinHint">Halten: automatisch drehen</small></button>
      <div class="sidekit">
        <button class="chip" id="petChip"><svg viewBox="0 0 100 100" id="petIcon"></svg><span><b>Maulwurf Moritz</b><span id="petTxt">schläft</span></span></button>
        <button class="chip" id="wheelChip"><svg viewBox="0 0 100 100" id="wheelIcon"></svg><span><b>Glücksrad</b><span id="wheelTxt">bereit</span></span><span class="dot" id="wheelDot"></span></button>
      </div>
    </section>

    <section class="pane" id="p-village" hidden></section>
    <section class="pane" id="p-cards" hidden></section>
    <section class="pane" id="p-wheel" hidden></section>
    <section class="pane" id="p-team" hidden></section>
  </main>

  <nav id="nav">
    <button data-tab="slot" aria-current="page"><svg viewBox="0 0 100 100" data-ic="coin"></svg>Automat</button>
    <button data-tab="village"><svg viewBox="0 0 100 100" data-ic="house"></svg>Dorf<span class="badge" id="navVB" hidden>!</span></button>
    <button data-tab="cards"><svg viewBox="0 0 100 100" data-ic="card"></svg>Karten</button>
    <button data-tab="wheel"><svg viewBox="0 0 100 100" data-ic="wheel"></svg>Rad<span class="badge" id="navWB" hidden>1</span></button>
    <button data-tab="team"><svg viewBox="0 0 100 100" data-ic="team"></svg>Team<span class="badge" id="navTB" hidden>0</span></button>
  </nav>
</div>
<div id="toast"></div>
<div id="modal" hidden><div class="panel" id="panel"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>

  chest:`<rect x="12" y="40" width="76" height="46" rx="6" fill="#9b5f2c" stroke="#5c3418" stroke-width="4"/><path d="M12 42 Q12 16 50 16 Q88 16 88 42 Z" fill="#b8763c" stroke="#5c3418" stroke-width="4"/><rect x="44" y="16" width="12" height="70" fill="#f2b632"/><rect x="40" y="40" width="20" height="16" rx="3" fill="#f2b632" stroke="#a86d10" stroke-width="3"/>`,
  chestG:`<rect x="12" y="40" width="76" height="46" rx="6" fill="#e1a52b" stroke="#8a5a0e" stroke-width="4"/><path d="M12 42 Q12 16 50 16 Q88 16 88 42 Z" fill="#f6c34a" stroke="#8a5a0e" stroke-width="4"/><rect x="44" y="16" width="12" height="70" fill="#fff1b8"/><rect x="40" y="40" width="20" height="16" rx="3" fill="#c0392b" stroke="#7a1f14" stroke-width="3"/>`,

const svg=(k,cls='')=>`<svg viewBox="0 0 100 100" class="${cls}" aria-hidden="true">${ART[k]}</svg>`;
const inner=(k,x,y,s)=>`<svg x="${x}" y="${y}" width="${s}" height="${s}" viewBox="0 0 100 100">${ART[k]}</svg>`;

function building(hue,lvl,idx,dmg){
  const c1=`hsl(${hue} 62% 66%)`,c1s=`hsl(${hue} 50% 50%)`,c2=`hsl(${hue} 50% 32%)`,roof=`hsl(${(hue+160)%360} 68% 54%)`,roofS=`hsl(${(hue+160)%360} 60% 40%)`;
  if(lvl===0) return `<svg viewBox="0 0 110 110" aria-hidden="true"><ellipse cx="52" cy="98" rx="42" ry="9" fill="#0002"/><path d="M14 92 L30 70 H88 L96 92Z" fill="#c9a36a" stroke="#8a6a3a" stroke-width="2"/><path d="M36 88 H74 M52 76 V100" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/><rect x="80" y="56" width="4" height="26" fill="#8a5a33"/><path d="M84 58 L98 62 L84 66Z" fill="#ff6b57"/></svg>`;
  const h=24+lvl*13,w=48+lvl*3,x=50-w/2,y=94-h,d=10;

const OUT=[{k:'coin3',w:9},{k:'bag3',w:4},{k:'energy3',w:4},{k:'hammer3',w:8},{k:'mask3',w:4.5},{k:'shield3',w:5.5},{k:'coin2',w:15},{k:'coin1',w:24},{k:'none',w:26}];
function buildReels(o){
  const nc=SYMS.filter(s=>s!=='coin');
  const tri=o.k.endsWith('3')?o.k.slice(0,-1):null;
  if(tri)return [tri,tri,tri];
  if(o.k==='coin2'){const a=['coin','coin',pick(nc)];return a.sort(()=>Math.random()-.5)}
  if(o.k==='coin1'){let a,b;do{a=pick(nc);b=pick(nc)}while(a===b);const r=['coin',a,b];return r.sort(()=>Math.random()-.5)}
  let r;do{r=[pick(nc),pick(nc),pick(nc)]}while(r[0]===r[1]&&r[1]===r[2]);return r;
}
function setStrip(R,list){R.strip.style.transition='none';R.strip.style.transform='translateY(0)';R.strip.innerHTML=list.map(s=>`<div class="cell">${svg(s)}</div>`).join('')}
function spinReel(R,final,dur){
  return new Promise(res=>{
    const n=18+Math.floor(dur/120);
    const list=[...R.vis];for(let i=0;i<n;i++)list.push(pick(SYMS));
    const top=pick(SYMS),bot=pick(SYMS);list.push(top,final,bot);
    setStrip(R,list);
    const sh=R.strip.firstChild.offsetHeight;
    requestAnimationFrame(()=>{requestAnimationFrame(()=>{
      R.strip.style.transition=`transform ${dur}ms cubic-bezier(.25,.1,.2,1.04)`;
      R.strip.style.transform=`translateY(${-(list.length-3)*sh}px)`;
    })});
    setTimeout(()=>{R.vis=[top,final,bot];setStrip(R,R.vis);res()},dur+40);
  });
}
let spinning=false,auto=false;
async function spin(){
  if(spinning||modalOpen())return;
  regen();
  if(S.spins<1){auto=false;updateAutoBtn();showOutOfSpins();return}
  if(S.bet>S.spins){S.bet=[...BETS].reverse().find(b=>b<=S.spins)||1}
  spinning=true;S.spins-=S.bet;S.spun++;renderTop();renderSlot();
  REELS.forEach(R=>R.el.classList.remove('win'));
  const o=wpick(OUT);const res=buildReels(o);
  await Promise.all(REELS.map((R,i)=>spinReel(R,res[i],650+i*230)));
  spinning=false;
  resolveSpin(o.k);
}
function resolveSpin(k){
  const B=Bv(),bet=S.bet;setWin(k,B,bet);
  if(k.endsWith('3'))REELS.forEach(R=>R.el.classList.add('win'));
  if(k==='coin1'){addCoins(B*1.2*bet);fly('+'+fmt(B*1.2*bet))}
  else if(k==='coin2'){addCoins(B*5*bet);fly('+'+fmt(B*5*bet))}
  else if(k==='coin3'){addCoins(B*18*bet);fly('+'+fmt(B*18*bet));toast('Münzregen!')}
  else if(k==='bag3'){addCoins(B*70*bet);bigWin('Goldsäcke!',B*70*bet)}
  else if(k==='energy3'){S.spins+=10*bet;S.tokens+=1;fly('+'+10*bet+' Versuche');toast('+1 Donnermünze für das Donnerrad');evAdd(5*bet)}
  else if(k==='shield3'){if(S.shields<3){S.shields++;toast('Schild aufgeladen ('+S.shields+'/3)')}else{addCoins(B*12*bet);fly('+'+fmt(B*12*bet));toast('Schilde voll – du bekommst Münzen')}}
  else if(k==='hammer3'){if(S.team)castleAdd(1);evAdd(15*bet);renderAll();save();setTimeout(()=>attack(bet),350);return}
  else if(k==='mask3'){evAdd(25*bet);renderAll();save();setTimeout(()=>raid(bet),350);return}
  renderAll();save();
  if(auto)setTimeout(spin,k==='none'?260:520);
}

let rd=null;
function raid(bet){
  const B=Bv(),pet=petActive();
  const pool=S.rich.amt*0.012*bet+B*20*bet;
  const share=[0.42,0.22,0.16,0.08,0.05,0.04,0.03,0,0].sort(()=>Math.random()-.5);
  rd={digs:pet?4:3,left:pet?4:3,vals:share.map(s=>Math.round(pool*s)),open:[],sum:0,who:S.rich.n};
  renderRaid();
}
function renderRaid(){
  openModal(`<div class="ptitle">${svg('mask')}</div><h3>Überfall bei ${rd.who}</h3>
  <p>Grab an ${rd.digs} Stellen nach Münzen.${rd.digs===4?' Moritz buddelt mit: ein Extra-Loch!':''}</p>
  <div class="holes">${rd.vals.map((v,i)=>rd.open.includes(i)?`<div class="hole open">${v?svg(v>=rd.vals.reduce((a,b)=>a+b,0)*.15?'bag':'coin')+'<span class="num">'+fmt(v)+'</span>':'leer'}</div>`:`<button class="hole" onclick="dig(${i})" ${rd.left?'':'disabled'} aria-label="Graben"></button>`).join('')}</div>
  <div class="big num">${fmt(rd.sum)}</div>
  ${rd.left?`<p>Noch ${rd.left}× graben</p>`:`<button class="btn gold wide" onclick="endRaid()">Beute einsammeln</button>`}`)
}
function dig(i){if(!rd.left||rd.open.includes(i))return;rd.open.push(i);rd.left--;rd.sum+=rd.vals[i];renderRaid()}
function endRaid(){addCoins(rd.sum);S.rich=newRich();closeModal();fly('+'+fmt(rd.sum))}

/* ---------- Events ---------- */
function evAdd(p){
  const ev=S.ev;ev.pts+=p;
  while(ev.st<EVM.length&&ev.pts>=EVM[ev.st]){grant(EVR[ev.st],'Beutejagd-Stufe '+(ev.st+1));ev.st++}
  if(ev.st>=EVM.length){ev.round++;ev.st=0;ev.pts=0;toast('Neue Beutejagd-Runde gestartet')}
}
function grant(r,why){
  const B=Bv(),parts=[];
  if(r.spins){S.spins+=r.spins;parts.push(r.spins+' Versuche')}
  if(r.coins){addCoins(r.coins*B);parts.push(fmt(r.coins*B)+' Münzen')}
  if(r.gems){S.gems+=r.gems;parts.push(r.gems+' Juwelen')}
  if(r.tokens){S.tokens+=r.tokens;parts.push(r.tokens+' Donnermünzen')}
  if(r.treats){S.treats+=r.treats;parts.push(r.treats+' Leckerli')}
  toast(why+': '+parts.join(', '));
  if(r.chest)setTimeout(()=>openChest(r.chest,true),400);
}
function rwIcon(r){return r.spins?['energy',r.spins]:r.coins?['coin',fmt(r.coins*Bv())]:r.gems?['gem',r.gems]:r.tokens?['token',r.tokens]:['treat',r.treats]}

/* ===================== Dorf ===================== */
const vil=()=>VILL[S.v%VILL.length];
const cost=(b,l)=>Math.round(Bv()*22*BMUL[b]*(l+1)/1000)*1000;
const repairCost=b=>Math.round(cost(b,Math.max(0,S.bl[b]-1))*.4/1000)*1000;
function build(b){
  if(S.dmg[b]){const c=repairCost(b);if(S.coins<c)return toast('Nicht genug Münzen');S.coins-=c;S.dmg[b]=0;toast(vil().b[b]+' repariert');renderAll();save();return}

  if(S.bl.every(l=>l>=MAXL)&&S.dmg.every(d=>!d))return villageDone();
  renderAll();save();
}
function villageDone(){

  <p>Belohnung: ${rs} Versuche, ${rg} Juwelen, 1 Leckerli.</p><p>Weiter geht es nach <b>${VILL[(S.v+1)%VILL.length].n}</b>.</p>
  <button class="btn gold wide" onclick="nextVillage()">Ins nächste Dorf</button>`)
}
function nextVillage(){S.v++;S.bl=[0,0,0,0,0];S.dmg=[0,0,0,0,0];S.rich=newRich();closeModal()}
function renderVillage(){

  <div class="vscene">${S.bl.map((l,i)=>building(v.h,l,i,S.dmg[i]).replace('<svg',`<svg style="left:${pos[i]}%;bottom:${i%2?26:8}px"`)).join('')}</div>
  <div class="blist">${S.bl.map((l,i)=>{

    ${l>=MAXL&&!d?'<span class="vprog">Fertig</span>':`<button class="btn ${d?'red':''}" onclick="build(${i})" ${S.coins<c?'disabled':''}>${d?'Reparieren':l===0?'Bauen':'Ausbauen'}<small class="num">${fmt(c)}</small></button>`}</div>`}).join('')}</div>`;
}

/* ===================== Karten ===================== */
const cid=(s,i)=>s+'-'+i;
function drawCard(min=1){
  const l=[];SETS.forEach((st,s)=>RAR.forEach((r,i)=>{if(r>=min)l.push({s,i,w:RW[r]})}));return wpick(l);
}
function openChest(type,free){
  const ch=CHESTS[type],c=ch.cost*Bv();
  if(!free){if(S.coins<c)return toast('Nicht genug Münzen');S.coins-=c}
  const got=[];for(let k=0;k<ch.n;k++)got.push(drawCard(k===0?ch.min:1));
  const before=new Set(S.sets);
  got.forEach(g=>{const id=cid(g.s,g.i);S.cards[id]=(S.cards[id]||0)+1});
  let treat=Math.random()<(type==='Holz'?.15:type==='Gold'?.35:.7);if(treat)S.treats++;
  const newSets=checkSets().filter(s=>!before.has(s));
  openModal(`<div class="ptitle" style="height:70px">${svg(ch.art)}</div><h3>${type}truhe</h3>
  <div class="cardsrow">${got.map(g=>cardHtml(g.s,g.i,true)).join('')}</div>
  ${treat?`<p>+1 Leckerli für Moritz</p>`:''}
  ${newSets.map(s=>`<p><b>Set „${SETS[s].n}“ komplett!</b> +150 Versuche, +10 Juwelen</p>`).join('')}
  <button class="btn gold wide" onclick="closeModal()">Super</button>`);
}
function checkSets(){
  SETS.forEach((st,s)=>{if(!S.sets.includes(s)&&st.c.every((_,i)=>S.cards[cid(s,i)])){S.sets.push(s);S.spins+=150;S.gems+=10;addCoins(Bv()*80)}});
  if(S.sets.length===SETS.length&&!S.album){S.album=true;S.spins+=1000;S.gems+=50;setTimeout(()=>toast('Album komplett! +1000 Versuche'),600)}
  return S.sets;
}
function cardHtml(s,i,reveal){
  const n=S.cards[cid(s,i)]||0,r=RAR[i],st=SETS[s];
  if(!n&&!reveal)return `<div class="card miss"><span class="st">${'★'.repeat(r)}</span><span class="ic">?</span><span>${st.c[i]}</span></div>`;
  return `<div class="card r${r}" style="background:linear-gradient(160deg,${st.col},#0005),${st.col}">${n>1&&!reveal?`<span class="cnt">+${n-1}</span>`:''}<span class="st">${'★'.repeat(r)}</span><span class="ic">${st.c[i][0]}</span><span>${st.c[i]}</span></div>`;
}
function dupes(){let p=0;for(const k in S.cards){const i=+k.split('-')[1];if(S.cards[k]>1)p+=(S.cards[k]-1)*RAR[i]}return p}
function tradeDupes(){const p=dupes();if(!p)return toast('Keine doppelten Karten');for(const k in S.cards)if(S.cards[k]>1)S.cards[k]=1;S.spins+=p*3;toast('Doppelte getauscht: +'+p*3+' Versuche');renderAll();save()}
function useJoker(){
  const miss=[];SETS.forEach((st,s)=>st.c.forEach((_,i)=>{if(!S.cards[cid(s,i)])miss.push([s,i])}));
  if(!miss.length){S.gems+=20;toast('Album voll – der Joker wird zu 20 Juwelen');return}
  openModal(`<div class="ptitle">${svg('joker')}</div><h3>Joker einlösen</h3><p>Wähle eine Karte, die dir fehlt.</p>
  <div class="cardsrow">${miss.map(([s,i])=>`<button onclick="jokerTake(${s},${i})">${cardHtml(s,i,true)}</button>`).join('')}</div>`,null)
}
function jokerTake(s,i){S.cards[cid(s,i)]=1;checkSets();closeModal();toast(SETS[s].c[i]+' erhalten')}
function renderCards(){
  const own=Object.keys(S.cards).length,dp=dupes(),B=Bv();
  $('p-cards').innerHTML=`
  <div class="vhead"><h2>Kartenalbum</h2><span class="vprog num">${own}/54</span></div>
  <div class="chests">${Object.entries(CHESTS).map(([k,c])=>`<div class="chest">${svg(c.art)}<span class="n">${k}truhe</span><span class="d">${c.n} Karten, ab ${c.min}★</span><button class="btn gold" onclick="openChest('${k}')" ${S.coins<c.cost*B?'disabled':''}><span class="num">${fmt(c.cost*B)}</span></button></div>`).join('')}</div>
  <button class="btn wide" onclick="tradeDupes()" ${dp?'':'disabled'}>Doppelte tauschen<small>${dp?'+'+dp*3+' Versuche':'keine doppelten Karten'}</small></button>
  ${SETS.map((st,s)=>{const c=st.c.filter((_,i)=>S.cards[cid(s,i)]).length;return `<div class="set ${S.sets.includes(s)?'done':''}"><header>${st.n}<span>${S.sets.includes(s)?'Komplett':c+'/9 · Belohnung 150 Versuche'}</span></header><div class="cgrid">${st.c.map((_,i)=>cardHtml(s,i)).join('')}</div></div>`}).join('')}`;
}

/* ===================== Glücksrad ===================== */
const WD=[{t:'spins',v:25,w:20},{t:'coins',v:40,w:22},{t:'gems',v:5,w:12},{t:'chest',v:'Gold',w:10},{t:'spins',v:100,w:8},{t:'coins',v:150,w:10},{t:'joker',w:3},{t:'treats',v:2,w:15}];
const WT=[{t:'spins',v:60,w:22},{t:'chest',v:'Magie',w:8},{t:'gems',v:15,w:12},{t:'coins',v:250,w:18},{t:'spins',v:300,w:6},{t:'treats',v:3,w:16},{t:'joker',w:6},{t:'spins',v:150,w:12},{t:'shield',w:10},{t:'coins',v:600,w:6}];
let wheelMode='daily',wheelRot=0,wheelBusy=false;
const wFree=()=>Date.now()-S.wheelAt>=DAY;
const segIcon=x=>({spins:'energy',coins:'coin',gems:'gem',chest:x.v==='Magie'?'chestM':'chestG',joker:'joker',treats:'treat',shield:'shield'})[x.t];
const segLbl=x=>x.t==='coins'?fmt(x.v*Bv()):x.t==='chest'?x.v:x.t==='joker'?'Joker':x.t==='shield'?'Schild':String(x.v);
function wheelSvg(segs){
  const n=segs.length,a=360/n,R=125;let out='';
  segs.forEach((s,i)=>{
    const a0=(i*a-a/2-90)*Math.PI/180,a1=(i*a+a/2-90)*Math.PI/180;
    const p=`M0 0 L${R*Math.cos(a0)} ${R*Math.sin(a0)} A${R} ${R} 0 0 1 ${R*Math.cos(a1)} ${R*Math.sin(a1)}Z`;
    out+=`<path d="${p}" fill="${i%2?'#ffe9b0':'#f6cf6a'}" stroke="#a86d10" stroke-width="2"/>`;
    out+=`<g transform="rotate(${i*a})">${inner(segIcon(s),-17,-112,34)}<text x="0" y="-66" text-anchor="middle" font-family="Lilita One,sans-serif" font-size="13" fill="#5a3a10">${segLbl(s)}</text></g>`;
  });
  return `<svg class="wh" id="wh" viewBox="-130 -130 260 260" style="transform:rotate(${wheelRot}deg)"><circle r="129" fill="#7d4ee0"/>${out}<circle r="128" fill="none" stroke="#3a1d78" stroke-width="5"/>${[...Array(n)].map((_,i)=>`<circle cx="${124*Math.cos((i*a-a/2-90)*Math.PI/180)}" cy="${124*Math.sin((i*a-a/2-90)*Math.PI/180)}" r="4" fill="#fff"/>`).join('')}</svg>`;
}
function renderWheel(){
  const segs=wheelMode==='daily'?WD:WT,free=wFree();
  $('p-wheel').innerHTML=`
  <div class="wtabs"><button aria-pressed="${wheelMode==='daily'}" onclick="setWM('daily')">Tagesrad</button><button aria-pressed="${wheelMode==='thunder'}" onclick="setWM('thunder')">Donnerrad</button></div>
  <div class="wwrap"><svg class="pointer" viewBox="0 0 34 40"><path d="M2 2 H32 L17 38Z" fill="#ff6b57" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>${wheelSvg(segs)}<div class="wcenter">${wheelMode==='daily'?'Tag':'Donner'}</div></div>
  ${wheelMode==='daily'
   ?`<button class="btn ${free?'gold':''} wide" onclick="spinWheel()" ${wheelBusy?'disabled':''}>${free?'Gratis drehen':'Drehen für 8 Juwelen'}<small class="num" id="wTimer">${free?'1× täglich gratis':'Gratisversuch in '+hms(DAY-(Date.now()-S.wheelAt))}</small></button>`
   :`<button class="btn gold wide" onclick="spinWheel()" ${S.tokens<1||wheelBusy?'disabled':''}>Drehen<small>Du hast ${S.tokens} Donnermünzen</small></button><p class="winfo">Donnermünzen gibt es für drei Akkus am Automaten und in der Beutejagd.</p>`}`;
}
function setWM(m){if(wheelBusy)return;wheelMode=m;wheelRot=0;renderWheel()}
function spinWheel(){
  if(wheelBusy)return;
  const segs=wheelMode==='daily'?WD:WT;
  if(wheelMode==='daily'){if(wFree())S.wheelAt=Date.now();else{if(S.gems<8)return toast('Nicht genug Juwelen');S.gems-=8}}
  else{if(S.tokens<1)return;S.tokens--}
  const w=wpick(segs),k=segs.indexOf(w),a=360/segs.length;
  wheelBusy=true;renderAll();
  const cur=wheelRot%360;wheelRot=wheelRot-cur+360*5+(360-k*a)%360+rnd(-a*.3,a*.3);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$('wh').style.transform=`rotate(${wheelRot}deg)`}));
  setTimeout(()=>{wheelBusy=false;wheelPrize(w);save()},4300);
}
function wheelPrize(w){
  const B=Bv();
  if(w.t==='spins'){S.spins+=w.v;toast('+'+w.v+' Versuche')}
  if(w.t==='coins'){addCoins(w.v*B);toast('+'+fmt(w.v*B)+' Münzen')}
  if(w.t==='gems'){S.gems+=w.v;toast('+'+w.v+' Juwelen')}
  if(w.t==='treats'){S.treats+=w.v;toast('+'+w.v+' Leckerli')}
  if(w.t==='shield'){if(S.shields<3)S.shields++;toast('Schild aufgeladen')}
  renderAll();
  if(w.t==='chest')openChest(w.v,true);
  if(w.t==='joker')useJoker();
}

/* ===================== Team ===================== */
const FLAGS=[['#26232f','#d22','#f5c400'],['#3b7be0','#fff','#3b7be0'],['#43d3b1','#1b1733','#43d3b1'],['#ff6b57','#f2b632','#ff6b57'],['#7d4ee0','#f2b632','#7d4ee0'],['#3f9a55','#fff','#e0563f'],['#1d4a96','#f2b632','#1d4a96'],['#e85fb3','#fff','#e85fb3']];
const flagCss=i=>{const f=FLAGS[i%FLAGS.length];return `background:linear-gradient(90deg,${f[0]} 33%,${f[1]} 33% 66%,${f[2]} 66%)`};
const BOT_TEAMS=[];
const TALK=['Danke für die Versuche!','Wer hat noch doppelte Hafenkarten?','Gleich startet die Beutejagd','Hab gerade drei Goldsäcke gezogen','Bin heute Abend wieder online','Wir schaffen das Schloss noch','Moritz ist der Beste','Rache an Bodo ist erledigt','Hallo zusammen!'];
let lobby='search',teamQ='',TD={name:'',desc:'',flag:0,open:true},teamErr='';
const mates=()=>S.team?S.team.members.filter(n=>n!=='Du'):[];
function joinTeam(i){
  if(cloudOn()){const t=cTeams[i];return cAct(()=>rpc('join_team',{p_team:t.id}),r=>r==='joined'?'Du bist '+t.name+' beigetreten':'Anfrage gesendet – der Anführer muss zustimmen')}
  const t=BOT_TEAMS[i];
  if(t.n>=50)return toast('Das Team ist voll');
  if(S.stars<t.min)return toast('Dafür brauchst du mindestens '+full(t.min)+' Sterne');
  const pool=[...BOTS].sort(()=>Math.random()-.5);
  S.team={name:t.name,flag:t.flag,desc:t.desc,open:t.open,own:false,members:['Du',...pool.slice(0,Math.min(t.n,pool.length))],extra:Math.max(0,t.n-pool.length),stars:t.stars};
  S.chat=[];S.myReq=null;S.castle={h:ri(0,8),max:15,lvl:ri(1,4)};seedTeam();
  S.chat.push({id:Date.now(),n:mates()[0],type:'msg',txt:'Willkommen im Team!',at:Date.now()});
  toast(t.open?'Du bist '+t.name+' beigetreten':'Anfrage angenommen – willkommen bei '+t.name);
  renderAll();save();
}
function createTeam(){
  const name=TD.name.trim();
  if(name.length<3||name.length>22){teamErr='Der Name braucht 3 bis 22 Zeichen.';return renderTeam()}
  if(!cloudOn()&&BOT_TEAMS.some(t=>t.name.toLowerCase()===name.toLowerCase())){teamErr='Diesen Namen gibt es schon. Wähle einen anderen.';return renderTeam()}
  if(S.coins<teamCost()){teamErr='Du brauchst '+fmt(teamCost())+' Münzen.';return renderTeam()}
  if(cloudOn()){const c=teamCost();teamErr='';return cAct(async()=>{await rpc('create_team',{p_name:name,p_flag:TD.flag,p_desc:TD.desc.trim(),p_open:TD.open});S.coins-=c},'Team gegründet')}
  S.coins-=teamCost();teamErr='';
  S.team={name,flag:TD.flag,desc:TD.desc.trim()||'Neues Team – macht mit!',open:TD.open,own:true,members:['Du'],extra:0,stars:0};
  S.chat=[{id:Date.now(),n:'System',type:'sys',txt:'Team „'+name+'“ gegründet. Neue Mitglieder kommen nach und nach dazu.',at:Date.now()}];
  S.myReq=null;S.castle={h:0,max:15,lvl:1};
  toast('Team gegründet');renderAll();save();
}
const teamCost=()=>Math.round(Bv()*10/1000)*1000;
function leaveTeam(){
  const others=S.team.cloud?S.team.count-1:mates().length,nxt=S.team.cloud?'das dienstälteste Mitglied':mates()[0];
  openModal(`<h3>Team verlassen?</h3><p>${S.team.own&&others?'Du bist Anführer. Die Leitung geht an '+nxt+'.':S.team.own&&!others?'Das Team wird aufgelöst, weil es keine weiteren Mitglieder hat.':'Du kannst danach jederzeit einem anderen Team beitreten.'}</p>
  <div class="row"><button class="btn" onclick="closeModal()">Bleiben</button><button class="btn red" onclick="doLeave()">Verlassen</button></div>`)
}
function doLeave(){if(cloudOn()){closeModal();return cAct(()=>rpc('leave_team'),'Du hast das Team verlassen')}const n=S.team.name;S.team=null;S.chat=[];S.myReq=null;lobby='search';closeModal();toast('Du hast '+n+' verlassen')}
function manageTeam(){
  if(cloudOn())return cManage();
  const t=S.team,ms=mates();
  openModal(`<div class="ptitle"><div class="flag" style="${flagCss(t.flag)}"></div></div><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p>

  ${t.own?`<div class="row"><button class="btn" onclick="toggleOpen()">${t.open?'Auf Anfrage stellen':'Für alle öffnen'}</button><button class="btn" onclick="editTeam()">Bearbeiten</button></div>`:''}
  <div class="list"><div class="li"><div class="av" style="background:var(--mint-d)">Du</div><p><b>Du</b>${t.own?' · Anführer':''}<time>${full(S.stars)} Sterne</time></p></div>
  ${ms.map(n=>`<div class="li"><div class="av" style="background:${avCol(n)}">${n[0]}</div><p><b>${n}</b><time>aktiv vor ${ri(1,59)} Min.</time></p>${t.own?`<button class="btn red" onclick="kick('${n}')">Entfernen</button>`:''}</div>`).join('')}

function toggleOpen(){if(cloudOn())return cAct(async()=>{const {error}=await sb.from('teams').update({open:!S.team.open}).eq('id',S.team.id);if(error)throw error},'Gespeichert').then(cManage);S.team.open=!S.team.open;save();manageTeam()}
function kick(n){S.team.members=S.team.members.filter(x=>x!==n);S.chat.push({id:Date.now(),n:'System',type:'sys',txt:n+' wurde aus dem Team entfernt.',at:Date.now()});save();manageTeam()}
function editTeam(){

const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
function seedTeam(){

function checkCastle(){
  if(!S.team)return;

function help(id){if(cloudOn())return cAct(async()=>{await rpc('help_request',{p_msg:id});S.helped++;if(S.helped%3===0)await rpc('castle_add',{p_n:1})},'Versuch verschickt');const m=S.chat.find(x=>x.id===id);if(!m||m.got>=10||m.helped)return;m.got++;m.helped=1;S.helped++;if(S.helped%3===0)castleAdd(1);toast('Du hast '+m.n+' einen Versuch geschickt');renderAll();save()}
function requestSpins(){if(cloudOn()){if(cFeed.some(m=>m.type==='mine'))return toast('Du hast schon eine offene Anfrage');return cAct(async()=>{const {error}=await sb.from('team_messages').insert({team_id:S.team.id,user_id:me.id,kind:'req'});if(error)throw error},'Anfrage an dein Team gesendet')}if(S.myReq)return;S.myReq={got:0,max:10,at:Date.now()};S.chat.push({id:Date.now(),n:'Du',type:'mine',at:Date.now()});toast(mates().length?'Anfrage an dein Team gesendet':'Noch niemand im Team – deine Anfrage wartet');renderAll();save()}
function collectReq(id){if(cloudOn())return cAct(async()=>{const g=await rpc('collect_request',{p_msg:id});S.spins+=g;return g},g=>'+'+g+' Versuche vom Team');if(!S.myReq||S.myReq.got<1)return;const g=S.myReq.got;S.spins+=g;S.myReq=null;S.chat=S.chat.filter(x=>x.type!=='mine');toast('+'+g+' Versuche vom Team');renderAll();save()}
function teamTick(){
  if(!S.team||S.team.cloud)return;
  const t=S.team;
  if(t.own&&t.members.length<50&&Math.random()<(t.open?.3:.12)){
    const cand=BOTS.filter(n=>!t.members.includes(n));
    if(cand.length){const n=pick(cand);t.members.push(n);S.chat.push({id:Date.now()+2,n:'System',type:'sys',txt:n+(t.open?' ist dem Team beigetreten.':' wurde ins Team aufgenommen.'),at:Date.now()});S.chat.push({id:Date.now()+3,n,type:'msg',txt:'Hallo zusammen!',at:Date.now()})}
  }
  const m=mates();if(!m.length)return;
  seedTeam();
  if(S.myReq&&S.myReq.got<S.myReq.max&&Math.random()<Math.min(.85,.15+m.length*.05))S.myReq.got++;
  const r=Math.random();
  if(r<.22)S.chat.push({id:Date.now(),n:pick(m),type:'req',got:0,at:Date.now()});
  else if(r<.36)S.chat.push({id:Date.now()+1,n:pick(m),type:'msg',txt:pick(TALK),at:Date.now()});
  S.chat.filter(x=>x.type==='req'&&x.got<10).forEach(x=>{if(Math.random()<.3)x.got++});
  if(S.chat.length>24)S.chat=S.chat.filter(x=>x.type==='mine').concat(S.chat.filter(x=>x.type!=='mine').slice(-22));
}

async function saveCfg(){

  if(!/^https:\/\/.+\..+/.test(url)||key.length<20){authErr='Bitte URL und Key vollständig eintragen.';return accountModal()}
  try{localStorage.setItem('beutezug_cloud',JSON.stringify({url,key}))}catch(e){}
  authErr='';sb=null;await cloudInit();if(!sb)authErr='Die Datenbank-Bibliothek konnte nicht geladen werden.';accountModal();
}
function resetCfg(){try{localStorage.removeItem('beutezug_cloud')}catch(e){}sb=null;me=null;authErr='';accountModal()}
async function doAuth(){
  AF.mail=$('aMail').value.trim();if(authMode==='signup')AF.name=$('aName').value.trim();
  const pw=$('aPw').value;
  if(!sb)await cloudInit();
  if(!sb){authErr='Keine Datenbank verbunden.';return accountModal()}
  if(authMode==='signup'&&AF.name.length<2){authErr='Der Spielername braucht mindestens 2 Zeichen.';return accountModal()}
  if(!AF.mail||pw.length<6){authErr='Bitte E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben.';return accountModal()}
  $('aGo').disabled=true;authErr='';
  try{
    if(authMode==='signup'){
      const {data,error}=await sb.auth.signUp({email:AF.mail,password:pw,options:{data:{name:AF.name}}});if(error)throw error;
      if(!data.session){authMode='login';authErr='Fast geschafft: Bestätige die E-Mail in deinem Postfach und melde dich dann an.';return accountModal()}

    }else{const {data,error}=await sb.auth.signInWithPassword({email:AF.mail,password:pw});if(error)throw error;await afterLogin(data.user)}
    closeModal();
  }catch(e){authErr=errMsg(e);accountModal()}

async function cAct(fn,ok){
  if(cBusy)return;cBusy=true;let r;
  try{r=await fn();if(ok)toast(typeof ok==='function'?ok(r):ok);await cRefreshMyTeam();if(!S.team)await cLoadTeams()}
  catch(e){toast(errMsg(e))}
  finally{cBusy=false;renderAll();save()}
  return r;
}
async function cManage(){
  try{
    const t=S.team;
    const {data:ms,error}=await sb.from('team_members').select('user_id,joined_at,profiles(name,stars)').eq('team_id',t.id).order('joined_at');if(error)throw error;
    let reqs=[];if(t.own){const r=await sb.from('team_join_requests').select('user_id,profiles(name,stars)').eq('team_id',t.id);reqs=r.data||[]}
    openModal(`<div class="ptitle"><div class="flag" style="${flagCss(t.flag)}"></div></div><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p>
    <p style="font-size:12px">${t.own?'Du bist Anführer':'Mitglied'} · ${t.open?'Offen für alle':'Beitritt auf Anfrage'} · ${ms.length}/50</p>
    ${t.own?`<div class="row"><button class="btn" onclick="toggleOpen()">${t.open?'Auf Anfrage stellen':'Für alle öffnen'}</button><button class="btn" onclick="editTeam()">Bearbeiten</button></div>`:''}
    ${reqs.length?`<p><b>Beitrittsanfragen</b></p><div class="list">${reqs.map(q=>`<div class="li"><div class="av" style="background:${avCol(q.profiles.name)}">${esc(q.profiles.name[0])}</div><p><b>${esc(q.profiles.name)}</b><time>${full(q.profiles.stars)} Sterne</time></p><button class="btn" onclick="cAnswer('${q.user_id}',true)">Ja</button><button class="btn red" onclick="cAnswer('${q.user_id}',false)">Nein</button></div>`).join('')}</div>`:''}
    <div class="list">${ms.map(m=>{const n=m.profiles?m.profiles.name:'?',isMe=m.user_id===me.id;return `<div class="li"><div class="av" style="background:${isMe?'var(--mint-d)':avCol(n)}">${esc(n[0])}</div><p><b>${esc(n)}${isMe?' (du)':''}</b>${m.user_id===t.leader?' · Anführer':''}<time>${full(m.profiles?m.profiles.stars:0)} Sterne</time></p>${t.own&&!isMe?`<button class="btn red" onclick="cKick('${m.user_id}')">Entfernen</button>`:''}</div>`}).join('')}</div>
    <div class="row"><button class="btn red" onclick="leaveTeam()">Team verlassen</button><button class="btn gold" onclick="closeModal()">Schließen</button></div>`);
  }catch(e){toast(errMsg(e))}
}
function cKick(uid){return cAct(()=>rpc('kick_member',{p_user:uid}),'Mitglied entfernt').then(cManage)}
function cAnswer(uid,acc){return cAct(()=>rpc('answer_join',{p_user:uid,p_accept:acc}),acc?'Spieler aufgenommen':'Anfrage abgelehnt').then(cManage)}
function saveTeamEdit(){
  const d=($('edDesc').value.trim()||S.team.desc).slice(0,80);
  if(cloudOn())return cAct(async()=>{const {error}=await sb.from('teams').update({description:d,flag:S.team.flag}).eq('id',S.team.id);if(error)throw error},'Gespeichert').then(cManage);
  S.team.desc=d;save();manageTeam();
}
function castleAdd(n){
  if(!S.team)return;
  if(S.team.cloud){if(cloudOn())rpc('castle_add',{p_n:n}).then(r=>{S.castle={h:r.h,max:r.max,lvl:r.lvl};return cRefreshMyTeam()}).then(()=>renderAll()).catch(e=>console.warn(e));return}
  S.castle.h=Math.min(S.castle.max,S.castle.h+n);checkCastle();
}
function sendChat(){
  const txt=chatDraft.trim().slice(0,200);if(!txt)return;chatDraft='';
  if(cloudOn())return cAct(async()=>{const {error}=await sb.from('team_messages').insert({team_id:S.team.id,user_id:me.id,kind:'msg',body:txt});if(error)throw error});
  S.chat.push({id:Date.now(),n:'Du',type:'mymsg',txt,at:Date.now()});
  if(mates().length)setTimeout(()=>{if(!S.team||S.team.cloud)return;S.chat.push({id:Date.now(),n:pick(mates()),type:'msg',txt:pick(['Klingt gut!','Bin dabei','Haha, genau','Danke dir!','Später mehr, muss los']),at:Date.now()});if(tab==='team'&&document.activeElement.id!=='chatIn')renderTeam();save()},3000+Math.random()*4000);
  renderTeam();save();
}

/* ===================== Nachbarn greifen an ===================== */
function botHit(quiet){
  const n=bot(),r=Math.random();
  if(r<.6){
    if(S.shields>0){S.shields--;S.log.unshift({t:Date.now(),k:'blocked',n,txt:`${n} hat angegriffen, dein Schild hat gehalten.`})}
    else{
      const built=S.bl.map((l,i)=>l>0&&!S.dmg[i]?i:-1).filter(i=>i>=0);
      if(built.length){const i=pick(built);S.dmg[i]=1;S.log.unshift({t:Date.now(),k:'attack',n,txt:`${n} hat dein Gebäude „${vil().b[i]}“ beschädigt.`});if(!S.revenge.includes(n))S.revenge.push(n)}
      else S.log.unshift({t:Date.now(),k:'blocked',n,txt:`${n} wollte angreifen, fand aber nichts.`});
    }
  }else{
    const a=Math.round(S.coins*rnd(.02,.06));S.coins-=a;S.log.unshift({t:Date.now(),k:'raid',n,txt:`${n} hat dich überfallen und ${fmt(a)} Münzen erbeutet.`});if(!S.revenge.includes(n))S.revenge.push(n);
  }
  S.revenge=S.revenge.slice(-5);S.log=S.log.slice(0,30);S.unread++;
  if(!quiet)toast(S.log[0].txt);
}
function logModal(){
  S.unread=0;
  openModal(`<h3>Nachrichten</h3><div class="list">${S.log.length?S.log.map(l=>`<div class="li">${svg(l.k==='blocked'?'shield':l.k==='raid'?'mask':'hammer')}<p>${l.txt}<time>vor ${ago(l.t)}</time></p>${S.revenge.includes(l.n)&&l.k!=='blocked'?'<span class="dmg">Rache möglich</span>':''}</div>`).join(''):'<p>Noch keine Angriffe. Genieß die Ruhe.</p>'}</div>
  <p style="font-size:12px">Rache: Beim nächsten Hammer-Dreier stehen diese Spieler ganz vorne in deiner Zielauswahl.</p>
  <button class="btn gold wide" onclick="closeModal()">Schließen</button>`)
  renderTop();
}

/* ===================== Zeit & Rendering ===================== */
function regen(){
  const t=Date.now();
  if(S.spins>=MAXSP){S.regenAt=t;return}
  const n=Math.floor((t-S.regenAt)/REGEN);
  if(n>0){S.spins=Math.min(MAXSP,S.spins+n);S.regenAt+=n*REGEN;if(S.spins>=MAXSP)S.regenAt=t}
}
function daily(){
  const d=dayKey();if(S.lastDay===d)return;
  const first=!S.lastDay;S.lastDay=d;
  if(!first){S.spins+=25;S.gems+=2;setTimeout(()=>openModal(`<div class="ptitle">${svg('energy')}${svg('gem')}</div><h3>Tagesbonus</h3><p>Schön, dass du da bist. +25 Versuche und +2 Juwelen.</p><button class="btn gold wide" onclick="closeModal()">Danke</button>`),500)}
}
function renderTop(){
  $('acctDot').hidden=!cloudOn();
  $('tCoins').textContent=S.coins>=1e7?fmt(S.coins):full(S.coins);$('tGems').textContent=S.gems;$('tStars').textContent=fmt(S.stars);$('tShields').textContent=S.shields+'/3';
  $('bellBadge').hidden=!S.unread;$('bellBadge').textContent=S.unread;
}
function renderSlot(){
  $('richName').textContent=S.rich.n;$('richAmt').textContent=fmt(S.rich.amt);
  const ev=S.ev,goal=EVM[ev.st],prev=ev.st?EVM[ev.st-1]:0;
  $('evRound').textContent='Runde '+ev.round;$('evTxt').textContent=full(ev.pts)+'/'+full(goal);
  $('evFill').style.width=Math.min(100,(ev.pts-prev)/(goal-prev)*100)+'%';
  const [ic,v]=rwIcon(EVR[ev.st]);$('evRw').innerHTML=svg(ic)+'<span class="num">'+v+'</span>';
  $('betTxt').textContent='x'+S.bet;
  $('spFill').style.width=Math.min(100,S.spins/MAXSP*100)+'%';
  $('spTxt').textContent=S.spins>MAXSP?S.spins+' Versuche':S.spins+'/'+MAXSP;
  $('spTimer').textContent=S.spins>=MAXSP?'Speicher voll':'+1 in '+hms(REGEN-(Date.now()-S.regenAt));
  $('petTxt').textContent=petActive()?'wach · '+hms(S.petUntil-Date.now()):S.treats?'schläft · füttern':'schläft';
  const f=wFree();$('wheelTxt').textContent=f?'Gratis drehen':hms(DAY-(Date.now()-S.wheelAt));$('wheelDot').hidden=!f;
}
function renderBadges(){
  const canBuild=S.bl.some((l,i)=>S.dmg[i]?S.coins>=repairCost(i):l<MAXL&&S.coins>=cost(i,l));
  $('navVB').hidden=!canBuild;$('navWB').hidden=!wFree();
  const open=S.team?S.chat.filter(m=>m.type==='req'&&m.got<10&&!m.helped).length+(S.myReq&&S.myReq.got>=S.myReq.max?1:0):0;
  $('navTB').hidden=!open;$('navTB').textContent=open;
}
let tab='slot';
function renderAll(){
  renderTop();renderBadges();
  if(tab==='slot')renderSlot();
  if(tab==='village')renderVillage();
  if(tab==='cards')renderCards();
  if(tab==='wheel'&&!wheelBusy)renderWheel();
  if(tab==='team')renderTeam();
}
function go(t){
  if(spinning||wheelBusy)return;
  if(t!=='slot'&&auto){auto=false;updateAutoBtn()}
  tab=t;document.querySelectorAll('.pane').forEach(p=>p.hidden=p.id!=='p-'+t);
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===t?'page':'false'));
  $('stage').scrollTop=0;renderAll();if(t==='team'&&cloudOn())cRefreshTab();
}
function updateAutoBtn(){$('spinBtn').classList.toggle('auto',auto);$('spinHint').textContent=auto?'Auto läuft · tippen zum Stoppen':'Halten: automatisch drehen'}

/* ===================== Start ===================== */
function start(data){
  S=(data&&data.coins!=null)?Object.assign(fresh(),data):load();
  if(!S.rich)S.rich=newRich();
  if(S.team&&!S.team.cloud&&!S.team.own){S.team=null;S.chat=[];S.myReq=null}
  // Zeit seit letztem Besuch
  const away=Date.now()-S.botAt,hits=Math.min(3,Math.floor(away/(20*6e4)));
  for(let i=0;i<hits;i++)botHit(true);S.botAt=Date.now();
  regen();daily();seedTeam();
  $('icCoin').innerHTML=ART.coin;$('icGem').innerHTML=ART.gem;$('icStar').innerHTML=ART.star;$('icShield').innerHTML=ART.shield;
  $('richIcon').innerHTML=ART.mask;$('petIcon').innerHTML=ART.fox;$('wheelIcon').innerHTML=ART.wheel;
  document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ART[e.dataset.ic]);
  REELS.forEach(R=>setStrip(R,R.vis));
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
  $('bell').onclick=logModal;$('acct').onclick=accountModal;$('payBtn').onclick=payModal;$('petChip').onclick=petModal;$('wheelChip').onclick=()=>go('wheel');
  $('betBtn').onclick=()=>{if(spinning)return;let i=BETS.indexOf(S.bet);do{i=(i+1)%BETS.length}while(BETS[i]>Math.max(1,S.spins)&&i!==0);S.bet=BETS[i];renderSlot();save()};
  const sb=$('spinBtn');let holdT=null,held=false;
  sb.addEventListener('pointerdown',e=>{if(auto){auto=false;updateAutoBtn();held=true;return}held=false;holdT=setTimeout(()=>{held=true;auto=true;updateAutoBtn();toast('Automatisches Drehen an');spin()},550)});
  const up=()=>{if(holdT){clearTimeout(holdT);holdT=null;if(!held)spin()}};
  sb.addEventListener('pointerup',up);sb.addEventListener('pointerleave',()=>{if(holdT){clearTimeout(holdT);holdT=null}});
  sb.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();spin()}});
  sb.addEventListener('contextmenu',e=>e.preventDefault());
  setInterval(()=>{regen();if(tab==='slot')renderSlot();if(tab==='wheel'&&!wheelBusy&&$('wTimer')&&!wFree())$('wTimer').textContent='Gratisversuch in '+hms(DAY-(Date.now()-S.wheelAt));renderTop()},1000);
  setInterval(()=>{teamTick();if(tab==='team'&&!modalOpen()&&S.team&&!S.team.cloud&&document.activeElement.id!=='chatIn')renderTeam();if(cloudOn()&&tab==='team')cRefreshTab();renderBadges();save()},9000);
  setInterval(()=>{if(Math.random()<.35&&!modalOpen()){botHit(false);S.botAt=Date.now();renderAll();save()}},150000);
  renderAll();save();
  oauthError();cloudInit();
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??null);
</script>
